<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NorthBay Living - FORESIGHT Dashboard</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #0f1724 0%, #1a2538 100%);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2a3a5a;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.3);
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #e8edf5, #90caf9);
            -webkit-background-clip: text;
            
            -webkit-text-fill-color: transparent;
        }

        .header-title span {
            font-size: 13px;
            color: #8a9bb5;
            font-weight: 400;
            -webkit-text-fill-color: #8a9bb5;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            color: #8a9bb5;
        }

        .badge {
            background: #1a2a44;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #90caf9;
            border: 1px solid #2a4a6a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* ===== Main Container ===== */
        .main-container {
            flex: 1;
            padding: 20px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== Dashboard Wrapper ===== */
        .dashboard-wrapper {
            flex: 1;
            background: #0f1724;
            border-radius: 12px;
            border: 1px solid #1e2e44;
            overflow: hidden;
            min-height: 600px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        .dashboard-wrapper iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            display: block;
            background: #0b0e14;
        }

        /* ===== Footer ===== */
        .footer {
            background: #0f1724;
            padding: 14px 24px;
            border-top: 1px solid #1a2a44;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: #5a6f8a;
        }

        .footer a {
            color: #5a8ab5;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #90caf9;
        }

        .footer .links {
            display: flex;
            gap: 20px;
        }

        /* ===== Loading ===== */
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f1724;
            z-index: 10;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .loading-overlay.hidden {
            opacity: 0;
        }

        .loading-overlay.hidden-display {
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a2a44;
            border-top-color: #42a5f5;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay p {
            margin-top: 16px;
            color: #6a7f9a;
            font-size: 14px;
        }

        .loading-overlay .sub-text {
            font-size: 12px;
            color: #4a5f7a;
            margin-top: 6px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .header {
                padding: 14px 18px;
            }

            .header-title h1 {
                font-size: 17px;
            }

            .header-right {
                font-size: 11px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .main-container {
                padding: 12px 14px 14px 14px;
            }

            .dashboard-wrapper {
                min-height: 400px;
            }

            .dashboard-wrapper iframe {
                min-height: 400px;
            }

            .footer {
                flex-direction: column;
                text-align: center;
                padding: 12px 16px;
            }

            .footer .links {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .header-left .logo-icon {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .header-title h1 {
                font-size: 15px;
            }

            .header-title span {
                font-size: 11px;
            }

            .badge {
                font-size: 10px;
                padding: 4px 10px;
            }

            .dashboard-wrapper {
                min-height: 300px;
            }

            .dashboard-wrapper iframe {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo-icon">F</div>
            <div class="header-title">
                <h1>FORESIGHT &bull; Demand Intelligence</h1>
                <span>NorthBay Living — D2C Home &amp; Lifestyle</span>
            </div>
        </div>
        <div class="header-right">
            <span class="badge">
                <span class="dot"></span> Live
            </span>
            <span>📅 Updated: <strong id="update-date">Today</strong></span>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="main-container">

        <!-- Dashboard -->
        <div class="dashboard-wrapper">
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <p>Loading FORESIGHT Dashboard …</p>
                <p class="sub-text">Please wait while the dashboard loads</p>
            </div>

            <!-- Power BI Embed -->
            <iframe
                id="dashboard-iframe"
                title="NorthBay FORESIGHT Dashboard"
                src="https://app.powerbi.com/reportEmbed?reportId=36a73f01-7d4c-4192-a5ec-b2cd580a382f&autoAuth=true&ctid=b1e9d22c-56ba-420f-9557-954cc18d4c7a&actionBarEnabled=true"
                allowFullScreen="true"
                loading="lazy"
                allow="autoplay; encrypted-media"
            ></iframe>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <span>
            &copy; 2026 <strong>Zidio Development</strong> &mdash; Data Science &amp; Analytics Engineering
        </span>
        <div class="links">
            <a href="#" onclick="refreshDashboard(); return false;">🔄 Refresh</a>
            <a href="#" onclick="openFullScreen(); return false;">⛶ Full Screen</a>
            <a href="#" onclick="window.open('https://app.powerbi.com/reportEmbed?reportId=36a73f01-7d4c-4192-a5ec-b2cd580a382f&autoAuth=true&ctid=b1e9d22c-56ba-420f-9557-954cc18d4c7a&actionBarEnabled=true', '_blank'); return false;">🔗 Open in New Tab</a>
            <a href="#" onclick="window.print(); return false;">🖨️ Print</a>
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ===== Set update date =====
        document.getElementById('update-date').textContent =
            new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

        // ===== Hide loading overlay once iframe loads =====
        const iframe = document.getElementById('dashboard-iframe');
        const overlay = document.getElementById('loading-overlay');

        iframe.addEventListener('load', function() {
            overlay.classList.add('hidden');
            setTimeout(() => {
                overlay.classList.add('hidden-display');
            }, 700);
        });

        // Fallback: hide after 10 seconds even if iframe doesn't fire 'load'
        setTimeout(() => {
            if (!overlay.classList.contains('hidden-display')) {
                overlay.classList.add('hidden');
                setTimeout(() => {
                    overlay.classList.add('hidden-display');
                }, 700);
            }
        }, 10000);

        // ===== Refresh dashboard =====
        function refreshDashboard() {
            const iframe = document.getElementById('dashboard-iframe');
            const currentSrc = iframe.src;
            overlay.classList.remove('hidden-display');
            overlay.classList.remove('hidden');
            iframe.src = '';
            setTimeout(() => {
                iframe.src = currentSrc;
            }, 400);
        }

        // ===== Open Full Screen =====
        function openFullScreen() {
            const wrapper = document.querySelector('.dashboard-wrapper');
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            } else if (wrapper.msRequestFullscreen) {
                wrapper.msRequestFullscreen();
            }
        }

        // ===== Keyboard shortcuts =====
        document.addEventListener('keydown', function(e) {
            // 'R' to refresh (without Ctrl/Cmd)
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                refreshDashboard();
            }
            // 'F' for full screen
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                openFullScreen();
            }
        });

        // ===== Console welcome message =====
        console.log('%c FORESIGHT Dashboard ', 'background:#0f1724;color:#42a5f5;font-size:20px;padding:10px;border-radius:8px;');
        console.log('%c NorthBay Living — Demand Intelligence Platform ', 'color:#8a9bb5;font-size:14px;');
        console.log('📊 Dashboard loaded successfully');
        console.log('🔄 Press "R" to refresh');
        console.log('⛶ Press "F" for full screen');
        console.log('📅 Last updated: ' + new Date().toLocaleString());

        // ===== Handle iframe errors =====
        iframe.addEventListener('error', function() {
            overlay.querySelector('p').textContent = '⚠️ Failed to load dashboard';
            overlay.querySelector('.sub-text').textContent = 'Please check your internet connection and try again';
            overlay.querySelector('.spinner').style.display = 'none';
        });
    </script>

</body>
</html>
